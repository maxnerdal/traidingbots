# Production Configuration
server.port=${PORT:8080}
spring.application.name=tradingbots-backend

# PostgreSQL Database Configuration
# Railway's DATABASE_URL is in format: postgresql://user:pass@host:port/db
# We need JDBC format: jdbc:postgresql://host:port/db
spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-make-it-at-least-256-bits}
jwt.expiration=86400000

# Logging
logging.level.com.tradingbots=INFO
logging.level.org.springframework.security=WARN

# CoinGecko API Configuration
coingecko.apiKey=${COINGECKO_API_KEY:}
coingecko.baseUrl=https://api.coingecko.com/api/v3
coingecko.proBaseUrl=https://pro-api.coingecko.com/api/v3

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
